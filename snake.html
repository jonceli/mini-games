<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 贪吃蛇</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #eee;
    overflow: hidden;
  }
  header {
    text-align: center;
    margin-bottom: 16px;
    padding: 0 16px;
  }
  header h1 { font-size: 24px; font-weight: 700; }
  header p { font-size: 14px; opacity: 0.7; margin-top: 4px; }
  
  #gameContainer {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  #scoreBoard {
    display: flex;
    gap: 24px;
    margin-bottom: 12px;
    font-size: 14px;
  }
  #scoreBoard span { opacity: 0.8; }
  #scoreBoard strong { color: #0f0; }
  
  #gameCanvas {
    border: 2px solid #333;
    border-radius: 8px;
    background: #0f0f23;
    touch-action: none;
  }
  
  #controls {
    margin-top: 16px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  
  button {
    background: #3d6b5e;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px 24px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 500;
  }
  button:hover { background: #2d5b4e; }
  button:active { transform: scale(0.97); }
  button.pause-btn { background: #8b6914; }
  button.pause-btn:hover { background: #a07a18; }
  
  #gameOverlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    background: rgba(0,0,0,0.9);
    padding: 32px 40px;
    border-radius: 16px;
    display: none;
    z-index: 10;
    min-width: 280px;
  }
  #gameOverlay h2 { font-size: 22px; margin-bottom: 8px; }
  #gameOverlay p { font-size: 14px; opacity: 0.8; margin-bottom: 16px; }
  
  #difficultySelect {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #difficultySelect button {
    padding: 8px 20px;
    font-size: 13px;
  }
  #difficultySelect button.easy { background: #2d8b5e; }
  #difficultySelect button.medium { background: #8b7a14; }
  #difficultySelect button.hard { background: #8b3d14; }
  #difficultySelect button.selected { outline: 2px solid #fff; }
  
  #mobileControls {
    display: none;
    margin-top: 16px;
    gap: 4px;
  }
  .d-pad {
    display: grid;
    grid-template-columns: 40px 40px 40px;
    grid-template-rows: 40px 40px 40px;
    gap: 4px;
  }
  .d-pad button {
    width: 40px;
    height: 40px;
    padding: 0;
    font-size: 18px;
    border-radius: 8px;
    background: #333;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .d-pad button:active { background: #555; }
  .d-pad .up { grid-column: 2; grid-row: 1; }
  .d-pad .left { grid-column: 1; grid-row: 2; }
  .d-pad .down { grid-column: 2; grid-row: 2; }
  .d-pad .right { grid-column: 3; grid-row: 2; }
  
  @media (max-width: 600px) {
    #mobileControls { display: grid; }
    #gameCanvas { max-width: 95vw; max-height: 60vh; }
  }
  
  a.back-link {
    position: fixed;
    top: 16px;
    left: 16px;
    color: #fff;
    opacity: 0.7;
    font-size: 14px;
    z-index: 100;
    text-decoration: none;
  }
  a.back-link:hover { opacity: 1; }
</style>
</head>
<body>
<a href="index.html" class="back-link">← 返回主页</a>

<header>
  <h1>🐍 贪吃蛇</h1>
  <p>选择难度，方向键 / WASD 控制</p>
</header>

<div id="gameContainer">
  <div id="scoreBoard">
    <span>分数: <strong id="score">0</strong></span>
    <span>最高: <strong id="highScore">0</strong></span>
  </div>
  
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  
  <div id="gameOverlay">
    <h2 id="overlayTitle">贪吃蛇</h2>
    <p id="overlayMsg">选择难度开始游戏</p>
    <div id="difficultySelect">
      <button class="easy" onclick="selectDifficulty('easy', this)">简单 (250ms)</button>
      <button class="medium selected" onclick="selectDifficulty('medium', this)">中等 (150ms)</button>
      <button class="hard" onclick="selectDifficulty('hard', this)">困难 (100ms)</button>
    </div>
    <button onclick="startGame()">开始游戏</button>
  </div>
  
  <div id="controls">
    <button onclick="startGame()">重新开始</button>
    <button class="pause-btn" onclick="togglePause()">暂停</button>
  </div>
  
  <div id="mobileControls">
    <div class="d-pad">
      <button class="up" onclick="setDirection('up')">↑</button>
      <button class="left" onclick="setDirection('left')">←</button>
      <button class="down" onclick="setDirection('down')">↓</button>
      <button class="right" onclick="setDirection('right')">→</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const overlay = document.getElementById('gameOverlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayMsg = document.getElementById('overlayMsg');
  const finalScoreEl = document.getElementById('finalScore');
  
  const gridSize = 20;
  const tileCount = canvas.width / gridSize;
  
  let snake = [{x: 10, y: 10}];
  let food = {x: 15, y: 15};
  let dx = 0, dy = 0;
  let score = 0;
  let highScore = parseInt(localStorage.getItem('snake_high_medium') || '0', 10);
  let gameLoop = null;
  let gameStarted = false;
  let isPaused = false;
  let currentDifficulty = 'medium';
  let speedMap = { easy: 250, medium: 150, hard: 100 };
  let scoreMap = { easy: 5, medium: 10, hard: 20 };
  
  highScoreEl.textContent = highScore;
  showOverlay('选择难度开始游戏', '贪吃蛇');
  
  function showOverlay(msg, title) {
    overlayTitle.textContent = title || '游戏结束';
    overlayMsg.textContent = msg;
    overlay.style.display = 'block';
  }
  
  function hideOverlay() {
    overlay.style.display = 'none';
  }
  
  function selectDifficulty(diff, btn) {
    currentDifficulty = diff;
    document.querySelectorAll('#difficultySelect button').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    highScore = parseInt(localStorage.getItem('snake_high_' + diff) || '0', 10);
    highScoreEl.textContent = highScore;
  }
  
  function drawGame() {
    ctx.fillStyle = '#0f0f23';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= tileCount; i++) {
      ctx.beginPath();
      ctx.moveTo(i * gridSize, 0);
      ctx.lineTo(i * gridSize, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * gridSize);
      ctx.lineTo(canvas.width, i * gridSize);
      ctx.stroke();
    }
    
    snake.forEach((segment, index) => {
      const gradient = ctx.createLinearGradient(
        segment.x * gridSize, segment.y * gridSize,
        segment.x * gridSize + gridSize, segment.y * gridSize + gridSize
      );
      if (index === 0) {
        gradient.addColorStop(0, '#0f0');
        gradient.addColorStop(1, '#0a0');
      } else {
        gradient.addColorStop(0, '#0a0');
        gradient.addColorStop(1, '#060');
      }
      ctx.fillStyle = gradient;
      ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
      
      if (index === 0) {
        ctx.fillStyle = '#fff';
        const eyeSize = 3;
        if (dx === 1) {
          ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 5, eyeSize, eyeSize);
          ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 12, eyeSize, eyeSize);
        } else if (dx === -1) {
          ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 5, eyeSize, eyeSize);
          ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 12, eyeSize, eyeSize);
        } else if (dy === -1) {
          ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 5, eyeSize, eyeSize);
          ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 5, eyeSize, eyeSize);
        } else if (dy === 1) {
          ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 12, eyeSize, eyeSize);
          ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 12, eyeSize, eyeSize);
        }
      }
    });
    
    ctx.fillStyle = '#f00';
    ctx.beginPath();
    ctx.arc(
      food.x * gridSize + gridSize / 2,
      food.y * gridSize + gridSize / 2,
      gridSize / 2 - 2,
      0,
      Math.PI * 2
    );
    ctx.fill();
    ctx.fillStyle = '#ff0';
    ctx.beginPath();
    ctx.arc(
      food.x * gridSize + gridSize / 2 - 2,
      food.y * gridSize + gridSize / 2 - 2,
      2,
      0,
      Math.PI * 2
    );
    ctx.fill();
  }
  
  function moveSnake() {
    if (isPaused || !gameStarted) return;
    
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};
    
    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
      gameOver();
      return;
    }
    
    for (let i = 0; i < snake.length; i++) {
      if (head.x === snake[i].x && head.y === snake[i].y) {
        gameOver();
        return;
      }
    }
    
    snake.unshift(head);
    
    if (head.x === food.x && head.y === food.y) {
      score += scoreMap[currentDifficulty];
      scoreEl.textContent = score;
      generateFood();
    } else {
      snake.pop();
    }
    
    drawGame();
  }
  
  function generateFood() {
    let newFood;
    do {
      newFood = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
    } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
    food = newFood;
  }
  
  function gameOver() {
    clearInterval(gameLoop);
    gameLoop = null;
    gameStarted = false;
    isPaused = false;
    
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snake_high_' + currentDifficulty, highScore);
      highScoreEl.textContent = highScore;
      showOverlay(`新纪录！🎉 分数: ${score}`, '游戏结束');
    } else {
      showOverlay(`你的分数: ${score}`, '游戏结束');
    }
  }
  
  function startGame() {
    clearInterval(gameLoop);
    snake = [{x: 10, y: 10}];
    dx = 1;
    dy = 0;
    score = 0;
    scoreEl.textContent = score;
    generateFood();
    gameStarted = true;
    isPaused = false;
    hideOverlay();
    drawGame();
    gameLoop = setInterval(moveSnake, speedMap[currentDifficulty]);
  }
  
  function togglePause() {
    if (!gameStarted) return;
    isPaused = !isPaused;
    document.querySelector('.pause-btn').textContent = isPaused ? '继续' : '暂停';
    if (isPaused) {
      showOverlay('游戏已暂停', '暂停');
    } else {
      hideOverlay();
    }
  }
  
  function setDirection(dir) {
    if (!gameStarted || isPaused) return;
    switch(dir) {
      case 'up':    if (dy === 0) { dx = 0; dy = -1; } break;
      case 'down':  if (dy === 0) { dx = 0; dy = 1; } break;
      case 'left':  if (dx === 0) { dx = -1; dy = 0; } break;
      case 'right': if (dx === 0) { dx = 1; dy = 0; } break;
    }
  }
  
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Escape') {
      if (gameStarted) {
        togglePause();
        e.preventDefault();
        return;
      }
    }
    if (!gameStarted && (e.key === 'Enter')) {
      startGame();
      return;
    }
    switch(e.key) {
      case 'ArrowUp':    case 'w': case 'W': setDirection('up');    break;
      case 'ArrowDown':  case 's': case 'S': setDirection('down');  break;
      case 'ArrowLeft':  case 'a': case 'A': setDirection('left');  break;
      case 'ArrowRight': case 'd': case 'D': setDirection('right'); break;
    }
    e.preventDefault();
  });
  
  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    e.preventDefault();
  }, {passive: false});
  
  canvas.addEventListener('touchend', (e) => {
    if (!gameStarted) {
      startGame();
      return;
    }
    const deltaX = e.changedTouches[0].clientX - touchStartX;
    const deltaY = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(deltaX) > Math.abs(deltaY)) {
      setDirection(deltaX > 0 ? 'right' : 'left');
    } else {
      setDirection(deltaY > 0 ? 'down' : 'up');
    }
    e.preventDefault();
  }, {passive: false});
  
  drawGame();
</script>
</body>
</html>
