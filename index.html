<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 小游戏合集</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #f7f6f3;
    min-height: 100vh;
    color: #2c2c2c;
  }
  header {
    background: #3d6b5e;
    color: white;
    text-align: center;
    padding: 40px 20px 32px;
  }
  header h1 { font-size: 28px; font-weight: 700; letter-spacing: 1px; }
  header p { margin-top: 8px; font-size: 15px; opacity: 0.85; }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    padding: 22px 16px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    text-decoration: none;
    color: inherit;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
  .card:active { transform: scale(0.97); }
  .card .icon { font-size: 36px; margin-bottom: 10px; }
  .card h2 { font-size: 17px; font-weight: 600; margin-bottom: 6px; color: #1a1a1a; }
  .card p { font-size: 12px; color: #888; margin-bottom: 10px; line-height: 1.5; }
  .card .best {
    font-size: 12px;
    color: #3d6b5e;
    background: #eef6f2;
    border-radius: 999px;
    padding: 5px 10px;
    margin-bottom: 12px;
    min-height: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .card .btn {
    background: #3d6b5e;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 7px 20px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 500;
  }
  footer {
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: #aaa;
  }
</style>
</head>
<body>
<header>
  <h1>🎮 小游戏合集</h1>
  <p>旅途中的小时光</p>
</header>
<main>
  <div class="grid">
    <a class="card" href="2048.html" data-game="2048">
      <div class="icon">🔢</div>
      <h2>2048</h2>
      <p>滑动合并，越大越好</p>
      <div class="best" data-best>最佳成绩：暂无</div>
      <button class="btn">开始游戏</button>
    </a>
    <a class="card" href="minesweeper.html" data-game="minesweeper">
      <div class="icon">💣</div>
      <h2>扫雷</h2>
      <p>经典排雷，小心踩坑</p>
      <div class="best" data-best>最佳成绩：暂无</div>
      <button class="btn">开始游戏</button>
    </a>
    <a class="card" href="sudoku.html" data-game="sudoku">
      <div class="icon">🔢</div>
      <h2>数独</h2>
      <p>数字逻辑，填满九宫格</p>
      <div class="best" data-best>最佳成绩：暂无</div>
      <button class="btn">开始游戏</button>
    </a>
    <a class="card" href="wordle.html" data-game="wordle">
      <div class="icon">📝</div>
      <h2>猜字</h2>
      <p>Wordle中文版，猜一个4字成语</p>
      <div class="best" data-best>最佳成绩：暂无</div>
      <button class="btn">开始游戏</button>
    </a>
    <a class="card" href="sokoban.html" data-game="sokoban">
      <div class="icon">📦</div>
      <h2>推箱子</h2>
      <p>经典关卡，动脑推推推</p>
      <div class="best" data-best>最佳成绩：暂无</div>
      <button class="btn">开始游戏</button>
    </a>
    <a class="card" href="tetris.html" data-game="tetris">
      <div class="icon">🟦</div>
      <h2>俄罗斯方块</h2>
      <p>经典下落消行，手速越快越爽</p>
      <div class="best" data-best>最佳成绩：暂无</div>
      <button class="btn">开始游戏</button>
    </a>
    <a class="card" href="24game.html" data-game="24game">
      <div class="icon">🧮</div>
      <h2>24点</h2>
      <p>四张牌凑出 24，挑战脑力</p>
      <div class="best" data-best>最佳成绩：暂无</div>
      <button class="btn">开始游戏</button>
    </a>
    <a class="card" href="snake.html" data-game="snake">
      <div class="icon">🐍</div>
      <h2>贪吃蛇</h2>
      <p>方向键控制，吃豆子长大</p>
      <div class="best" data-best>最佳成绩：暂无</div>
      <button class="btn">开始游戏</button>
    </a>
  </div>
</main>
<footer>用 ❤️ 制作，适合旅途</footer>
<script>
  function readInt(key) {
    try {
      const value = parseInt(localStorage.getItem(key) || '0', 10);
      return Number.isFinite(value) && value > 0 ? value : 0;
    } catch (e) {
      return 0;
    }
  }

  function formatSeconds(seconds) {
    if (!seconds) return '暂无';
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return m > 0 ? `${m}分${String(s).padStart(2, '0')}秒` : `${s}秒`;
  }

  function renderBestStats() {
    document.querySelectorAll('[data-game]').forEach(card => {
      const bestEl = card.querySelector('[data-best]');
      const game = card.dataset.game;
      let text = '最佳成绩：暂无';

      if (game === '2048') {
        const best = readInt('2048best');
        text = `最佳成绩：${best ? best.toLocaleString() : '暂无'}`;
      } else if (game === 'tetris') {
        const best = readInt('tetris_hiscore');
        text = `最佳成绩：${best ? best.toLocaleString() : '暂无'}`;
      } else if (game === 'minesweeper') {
        const bests = [0, 1, 2]
          .map(i => readInt(`minesweeper_best_${i}`))
          .filter(Boolean);
        if (bests.length) text = `最佳成绩：最快 ${formatSeconds(Math.min(...bests))}`;
      } else if (game === 'sudoku') {
        const bests = [35, 45, 55]
          .map(h => readInt(`sudoku_best_${h}`))
          .filter(Boolean);
        if (bests.length) text = `最佳成绩：最快 ${formatSeconds(Math.min(...bests))}`;
      } else if (game === 'sokoban') {
        const bests = Array.from({ length: 8 }, (_, i) => readInt(`sokoban_best_level_${i}`)).filter(Boolean);
        if (bests.length) text = `最佳成绩：最佳 ${Math.min(...bests)} 步`;
      } else if (game === 'wordle') {
        const best = readInt('wordle_best_attempts');
        text = `最佳成绩：${best ? `${best} 次猜中` : '暂无'}`;
      } else if (game === 'snake') {
        const best = readInt('snake_high');
        text = `最佳成绩：${best ? best.toLocaleString() : '暂无'}`;
      } else if (game === '24game') {
        const best = readInt('24game_solved');
        text = best ? `已完成 ${best} 局` : '暂无';
      }

      bestEl.textContent = text;
    });
  }

  renderBestStats();
</script>
</body>
</html>
