<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", sans-serif;
    background: #f7f6f3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .top-bar {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    padding: 16px 16px 8px;
    gap: 12px;
  }
  .back { text-decoration: none; color: #3d6b5e; font-size: 15px; font-weight: 500; }
  .title { font-size: 22px; font-weight: 700; color: #3d6b5e; flex: 1; text-align: center; }
  .scores {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 420px;
    padding: 0 16px 12px;
    justify-content: center;
  }
  .score-box {
    background: #3d6b5e;
    color: white;
    border-radius: 10px;
    padding: 8px 20px;
    text-align: center;
    min-width: 90px;
  }
  .score-box .label { font-size: 11px; opacity: 0.8; }
  .score-box .val { font-size: 20px; font-weight: 700; }
  #board-wrap {
    width: 100%;
    max-width: 420px;
    padding: 0 16px;
  }
  #board {
    background: #bbada0;
    border-radius: 10px;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    aspect-ratio: 1;
    width: 100%;
    user-select: none;
    touch-action: none;
  }
  .cell {
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: clamp(14px, 5vw, 28px);
    background: #cdc1b4;
    color: #776e65;
    transition: background 0.1s;
  }
  .cell[data-v="2"] { background: #eee4da; color: #776e65; }
  .cell[data-v="4"] { background: #ede0c8; color: #776e65; }
  .cell[data-v="8"] { background: #f2b179; color: #fff; }
  .cell[data-v="16"] { background: #f59563; color: #fff; }
  .cell[data-v="32"] { background: #f67c5f; color: #fff; }
  .cell[data-v="64"] { background: #f65e3b; color: #fff; }
  .cell[data-v="128"] { background: #edcf72; color: #fff; font-size: clamp(12px, 4vw, 22px); }
  .cell[data-v="256"] { background: #edcc61; color: #fff; font-size: clamp(12px, 4vw, 22px); }
  .cell[data-v="512"] { background: #edc850; color: #fff; font-size: clamp(12px, 4vw, 22px); }
  .cell[data-v="1024"] { background: #edc53f; color: #fff; font-size: clamp(10px, 3.5vw, 18px); }
  .cell[data-v="2048"] { background: #edc22e; color: #fff; font-size: clamp(10px, 3.5vw, 18px); }
  .btn-row {
    display: flex;
    justify-content: center;
    padding: 16px;
    gap: 12px;
  }
  button {
    background: #3d6b5e;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px 28px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 500;
  }
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .modal {
    background: white;
    border-radius: 20px;
    padding: 36px 32px;
    text-align: center;
    max-width: 300px;
    width: 90%;
  }
  .modal h2 { font-size: 24px; margin-bottom: 12px; color: #3d6b5e; }
  .modal p { color: #666; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="top-bar">
  <a class="back" href="index.html">← 返回</a>
  <span class="title">2048</span>
  <span style="width:48px"></span>
</div>
<div class="scores">
  <div class="score-box">
    <div class="label">当前分数</div>
    <div class="val" id="score">0</div>
  </div>
  <div class="score-box">
    <div class="label">最高分</div>
    <div class="val" id="best">0</div>
  </div>
</div>
<div id="board-wrap">
  <div id="board"></div>
</div>
<div class="btn-row">
  <button onclick="newGame()">重新开始</button>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modal-title">游戏结束</h2>
    <p id="modal-msg">没有可移动的步骤了</p>
    <button onclick="newGame();document.getElementById('overlay').classList.remove('show')">再来一局</button>
  </div>
</div>
<script>
let board, score, best, moved;
const SAVE_KEY = '2048_save_state';

function saveGameState() {
  localStorage.setItem(SAVE_KEY, JSON.stringify({board, score, best}));
}

function clearSaveState() {
  localStorage.removeItem(SAVE_KEY);
}

function newGame() {
  clearSaveState();
  board = Array.from({length:4}, () => Array(4).fill(0));
  score = 0;
  best = parseInt(localStorage.getItem('2048best') || '0');
  addTile(); addTile();
  render();
}

function addTile() {
  let empty = [];
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(!board[r][c]) empty.push([r,c]);
  if(!empty.length) return;
  let [r,c] = empty[Math.floor(Math.random()*empty.length)];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function render() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  const b = document.getElementById('board');
  b.innerHTML = '';
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const v = board[r][c];
    if(v) { cell.textContent = v; cell.dataset.v = v; }
    b.appendChild(cell);
  }
}

function slide(row) {
  let arr = row.filter(x=>x);
  let res = [], changed = false;
  for(let i=0;i<arr.length;i++) {
    if(i+1<arr.length && arr[i]===arr[i+1]) {
      const merged = arr[i]*2;
      res.push(merged);
      score += merged;
      if(score > best) { best = score; localStorage.setItem('2048best', best); }
      i++; changed = true;
    } else res.push(arr[i]);
  }
  while(res.length<4) res.push(0);
  if(!changed && JSON.stringify(row)!==JSON.stringify(res)) changed = true;
  else if(JSON.stringify(row)!==JSON.stringify(res)) changed = true;
  return {row: res, changed: JSON.stringify(row)!==JSON.stringify(res)};
}

function move(dir) {
  let changed = false;
  if(dir==='left') {
    for(let r=0;r<4;r++) { let {row,changed:c} = slide(board[r]); board[r]=row; if(c) changed=true; }
  } else if(dir==='right') {
    for(let r=0;r<4;r++) { let {row,changed:c} = slide([...board[r]].reverse()); board[r]=row.reverse(); if(c) changed=true; }
  } else if(dir==='up') {
    for(let c=0;c<4;c++) {
      let col = [0,1,2,3].map(r=>board[r][c]);
      let {row,changed:ch} = slide(col);
      row.forEach((v,r)=>board[r][c]=v); if(ch) changed=true;
    }
  } else if(dir==='down') {
    for(let c=0;c<4;c++) {
      let col = [3,2,1,0].map(r=>board[r][c]);
      let {row,changed:ch} = slide(col);
      row.forEach((v,i)=>board[3-i][c]=v); if(ch) changed=true;
    }
  }
  if(changed) { addTile(); render(); checkEnd(); saveGameState(); }
}

function checkEnd() {
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) {
    if(!board[r][c]) return;
    if(r+1<4 && board[r][c]===board[r+1][c]) return;
    if(c+1<4 && board[r][c]===board[r][c+1]) return;
  }
  document.getElementById('modal-title').textContent = '游戏结束';
  document.getElementById('modal-msg').textContent = `最终得分：${score}`;
  document.getElementById('overlay').classList.add('show');
  clearSaveState();
}

document.addEventListener('keydown', e => {
  const map = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  if(map[e.key]) { e.preventDefault(); move(map[e.key]); }
});

let tx, ty;
document.getElementById('board').addEventListener('touchstart', e => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, {passive:true});
document.getElementById('board').addEventListener('touchend', e => {
  let dx = e.changedTouches[0].clientX - tx;
  let dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if(Math.abs(dx) > Math.abs(dy)) move(dx>0?'right':'left');
  else move(dy>0?'down':'up');
}, {passive:true});

window.addEventListener('beforeunload', function() {
  if (score > 0 || board.some(r => r.some(v => v > 0))) saveGameState();
});

function restoreGame() {
  const saved = localStorage.getItem(SAVE_KEY);
  if (saved) {
    try {
      const data = JSON.parse(saved);
      if (data.board && data.board.length === 4) {
        board = data.board;
        score = data.score || 0;
        best = data.best || parseInt(localStorage.getItem('2048best') || '0');
        render();
        document.getElementById('modal-title').textContent = '📋 已恢复存档';
        return;
      }
    } catch(e) {}
  }
  newGame();
}

restoreGame();
</script>
</body>
</html>
