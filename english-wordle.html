<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猜词 - English Wordle</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f7f6f3; min-height: 100vh; }
  .top-bar { display: flex; align-items: center; padding: 16px 16px 8px; max-width: 520px; margin: 0 auto; }
  .back { text-decoration: none; color: #3d6b5e; font-size: 15px; font-weight: 500; }
  .title { font-size: 22px; font-weight: 700; color: #3d6b5e; flex: 1; text-align: center; }
  .subtitle { text-align: center; color: #888; font-size: 13px; padding: 0 16px 8px; line-height: 1.5; }
  .mode-bar, .difficulty-bar, .hint-bar { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 0 16px 10px; flex-wrap: wrap; }
  .mode-chip, .level-chip { background: white; color: #3d6b5e; border: 1px solid #d7e6df; border-radius: 999px; padding: 6px 12px; font-size: 12px; }
  .mode-btn, .difficulty-btn, .hint-btn, .action-btn {
    border: none; border-radius: 999px; padding: 8px 14px; font-size: 12px; font-family: inherit; cursor: pointer;
  }
  .mode-btn, .action-btn { background: #3d6b5e; color: white; }
  .difficulty-btn { background: white; color: #3d6b5e; border: 1px solid #d7e6df; }
  .difficulty-btn.active { background: #3d6b5e; color: white; border-color: #3d6b5e; }
  .hint-btn { background: #c8a84b; color: white; font-weight: 600; }
  .hint-btn:disabled { background: #d8d0bc; cursor: not-allowed; }
  .hint-text { font-size: 13px; color: #7b6a36; }
  .meta { text-align: center; color: #7f8f89; font-size: 12px; padding: 0 16px 8px; line-height: 1.5; }
  #board { display: flex; flex-direction: column; gap: 7px; padding: 8px 16px; max-width: 360px; margin: 0 auto; }
  .guess-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .guess-cell {
    aspect-ratio: 1; border-radius: 10px; border: 2px solid #ddd; display: flex; align-items: center; justify-content: center;
    font-size: clamp(16px, 5vw, 26px); font-weight: 700; background: white; color: #333; transition: all 0.25s; text-transform: uppercase;
  }
  .guess-cell.correct { background: #3d6b5e; color: white; border-color: #3d6b5e; }
  .guess-cell.present { background: #c8a84b; color: white; border-color: #c8a84b; }
  .guess-cell.absent { background: #888; color: white; border-color: #888; }
  .guess-cell.active { border-color: #3d6b5e; }
  #msg { text-align: center; font-size: 14px; color: #3d6b5e; font-weight: 600; padding: 6px 16px; min-height: 30px; }
  #keyboard { padding: 6px 12px 20px; max-width: 520px; margin: 0 auto; }
  .kb-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 6px; }
  .kb-key {
    min-width: 32px; height: 44px; padding: 0 8px; border: none; border-radius: 8px; background: white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08); color: #333; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    text-transform: uppercase;
  }
  .kb-key.correct { background: #3d6b5e; color: white; }
  .kb-key.present { background: #c8a84b; color: white; }
  .kb-key.absent { background: #bbb; color: white; }
  .kb-key.wide { min-width: 66px; font-size: 12px; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; z-index: 10; }
  .overlay.show { display: flex; }
  .modal { background: white; border-radius: 20px; padding: 28px 24px; text-align: center; max-width: 340px; width: 90%; }
  .modal h2 { font-size: 22px; margin-bottom: 8px; color: #3d6b5e; }
  .modal .answer { font-size: 28px; font-weight: 700; color: #333; margin: 10px 0 6px; text-transform: uppercase; }
  .modal .meaning { font-size: 13px; color: #888; margin-bottom: 8px; }
  .modal .result-grid { font-size: 22px; line-height: 1.4; white-space: pre-line; margin: 10px 0; }
  .modal p { color: #666; margin-bottom: 16px; font-size: 13px; line-height: 1.6; }
  .modal-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .modal-btns button { background: #3d6b5e; color: white; border: none; border-radius: 20px; padding: 9px 18px; font-size: 14px; font-family: inherit; cursor: pointer; }
  .modal-btns button.secondary { background: white; color: #3d6b5e; border: 2px solid #3d6b5e; }
</style>
</head>
<body>
<div class="top-bar">
  <a class="back" href="index.html">← 返回</a>
  <span class="title">🔤 猜词</span>
  <span style="width:48px"></span>
</div>
<p class="subtitle">英文 Wordle：猜一个 5 字母单词，共 6 次机会。支持每日题 / 随机题、4 档词库、提示、计时、下一局。</p>
<div class="mode-bar">
  <span class="mode-chip" id="mode-label">模式：每日一题</span>
  <button class="mode-btn" onclick="startDailyGame()">📅 每日题</button>
  <button class="mode-btn" onclick="startRandomGame()">🎲 随机换一题</button>
</div>
<div class="difficulty-bar">
  <button class="difficulty-btn active" id="level-daily" onclick="setLevel('daily')">日常常用词</button>
  <button class="difficulty-btn" id="level-school" onclick="setLevel('school')">初高中词</button>
  <button class="difficulty-btn" id="level-cet" onclick="setLevel('cet')">四六级词</button>
  <button class="difficulty-btn" id="level-mixed" onclick="setLevel('mixed')">混合模式</button>
</div>
<div class="meta" id="meta">难度：日常常用词｜词库 0 词</div>
<div class="hint-bar">
  <button class="hint-btn" id="hint-btn" onclick="useHint()">💡 提示</button>
  <span class="hint-text" id="hint-text">本局可提示 1 次：随机显示字母位置或中文意思</span>
</div>
<div id="board"></div>
<div id="msg"></div>
<div id="keyboard"></div>
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modal-title"></h2>
    <div class="answer" id="modal-answer"></div>
    <div class="meaning" id="modal-meaning"></div>
    <div class="result-grid" id="modal-result"></div>
    <p id="modal-msg"></p>
    <div class="modal-btns">
      <button class="secondary" onclick="copyResult()">复制结果</button>
      <button class="secondary" onclick="startNextRound()">下一局</button>
      <button onclick="document.getElementById('overlay').classList.remove('show')">关闭</button>
    </div>
  </div>
</div>
<script>

const MAX_ATTEMPTS = 6;

const ENGLISH_WORDLE_LEVEL_KEY = 'english_wordle_level';
const ENGLISH_WORDLE_RANDOM_KEY = 'english_wordle_random_game';
const ENGLISH_WORDLE_BEST_ATTEMPT_PREFIX = 'english_wordle_best_attempts_';

    { word: 'phase', hint: '阶段' },
    { word: 'prime', hint: '主要的；首要的' },
    { word: 'prior', hint: '先前的；优先的' },
    { word: 'proof', hint: '证据；证明' },
    { word: 'route', hint: '路线；路径' },
    { word: 'scope', hint: '范围；视野' },
    { word: 'shift', hint: '转变；轮班' },
    { word: 'theme', hint: '主题' },
    { word: 'trend', hint: '趋势' },
    { word: 'urban', hint: '城市的' },
    { word: 'valid', hint: '有效的' },
    { word: 'vital', hint: '至关重要的' },
    { word: 'yield', hint: '产生；收益' },
    { word: 'acute', hint: '严重的；敏锐的' },
    { word: 'ratio', hint: '比率' }
  ]
};

let targetEntry, guesses, currentGuess, gameOver, resultEmoji, currentMode, currentLevel, hintUsed, hintMode, hintValue, hintedIndex, roundStartTime, currentElapsedSeconds;

function uniqueEntries(entries) {
  const map = new Map();
  entries.forEach(entry => {
    if (!map.has(entry.word)) map.set(entry.word, entry);
  });
  return [...map.values()];
}

function getLevelBank(level) {
  if (level === 'mixed') {
    return uniqueEntries([...WORD_BANKS.daily, ...WORD_BANKS.school, ...WORD_BANKS.cet]);
  }
  return WORD_BANKS[level] || WORD_BANKS.daily;
}

const ALL_WORDS = uniqueEntries([...WORD_BANKS.daily, ...WORD_BANKS.school, ...WORD_BANKS.cet]);
const VALID_WORDS = new Set(ALL_WORDS.map(item => item.word));

function getToday() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

function hashString(input) {
  let hash = 2166136261;
  for (const ch of input) {
    hash ^= ch.charCodeAt(0);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

function createSeededRng(seedString) {
  let t = hashString(seedString) || 1;
  return function() {
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}

function formatDuration(seconds) {
  const s = Math.max(0, Math.floor(seconds || 0));
  const mm = String(Math.floor(s / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return `${mm}:${ss}`;
}

function levelLabel(level) {
  return LEVEL_LABELS[level] || LEVEL_LABELS.daily;
}

function getBestAttempts(level) {
  try {
    const value = parseInt(localStorage.getItem(ENGLISH_WORDLE_BEST_ATTEMPT_PREFIX + level) || '0', 10);
    return Number.isFinite(value) && value > 0 ? value : 0;
  } catch (e) {
    return 0;
  }
}

function getBestTime(level) {
  try {
    const value = parseInt(localStorage.getItem(ENGLISH_WORDLE_BEST_TIME_PREFIX + level) || '0', 10);
    return Number.isFinite(value) && value > 0 ? value : 0;
  } catch (e) {
    return 0;
  }
}

function saveBest(level, attempts, seconds) {
  try {
    const attemptKey = ENGLISH_WORDLE_BEST_ATTEMPT_PREFIX + level;
    const prevAttempts = parseInt(localStorage.getItem(attemptKey) || '0', 10);
    if (!prevAttempts || attempts < prevAttempts) localStorage.setItem(attemptKey, String(attempts));
    const timeKey = ENGLISH_WORDLE_BEST_TIME_PREFIX + level;
    const prevTime = parseInt(localStorage.getItem(timeKey) || '0', 10);
    if (seconds && (!prevTime || seconds < prevTime)) localStorage.setItem(timeKey, String(seconds));
  } catch (e) {
    // ignore storage failures
  }
}

function createDailyGame() {
  const bank = getLevelBank(currentLevel);
  const rng = createSeededRng(`${getToday()}-${currentLevel}`);
  const entry = bank[Math.floor(rng() * bank.length)];
  return { entry, level: currentLevel };
}

function createRandomGame() {
  const bank = getLevelBank(currentLevel);
  const entry = bank[Math.floor(Math.random() * bank.length)];
  return { entry, level: currentLevel };
}

function setLevelButtonState() {
  Object.keys(LEVEL_LABELS).forEach(level => {
    const btn = document.getElementById(`level-${level}`);
    if (btn) btn.classList.toggle('active', currentLevel === level);
  });
}

function setLevel(level, restart = true) {
  currentLevel = LEVEL_LABELS[level] ? level : 'daily';
  try { localStorage.setItem(ENGLISH_WORDLE_LEVEL_KEY, currentLevel); } catch (e) {}
  setLevelButtonState();
  if (restart) {
    if (currentMode === 'random') startRandomGame();
    else startDailyGame();
  }
}

function setModeLabel() {
  const el = document.getElementById('mode-label');
  if (!el) return;
  el.textContent = currentMode === 'random' ? '模式：随机一题' : '模式：每日一题';
}

function updateMeta() {
  const el = document.getElementById('meta');
  if (!el) return;
  const bankSize = getLevelBank(currentLevel).length;
  const bestAttempts = getBestAttempts(currentLevel);
  const bestTime = getBestTime(currentLevel);
  const bestParts = [];
  if (bestAttempts) bestParts.push(`最佳 ${bestAttempts} 次`);
  if (bestTime) bestParts.push(`最快 ${formatDuration(bestTime)}`);
  const bestText = bestParts.length ? `｜${bestParts.join('｜')}` : '';
  el.textContent = `难度：${levelLabel(currentLevel)}｜词库 ${bankSize} 词${bestText}`;
}

function startGame(mode, forcedGame) {
  currentMode = mode === 'random' ? 'random' : 'daily';
  const game = forcedGame && forcedGame.entry && forcedGame.entry.word
    ? forcedGame
    : (currentMode === 'random' ? createRandomGame() : createDailyGame());
  if (game.level && LEVEL_LABELS[game.level]) currentLevel = game.level;
  targetEntry = game.entry;
  guesses = [];
  currentGuess = '';
  gameOver = false;
  resultEmoji = [];
  hintUsed = false;
  hintMode = '';
  hintValue = '';
  hintedIndex = -1;
  roundStartTime = Date.now();
  currentElapsedSeconds = 0;
  try {
    localStorage.setItem(ENGLISH_WORDLE_MODE_KEY, currentMode);
    localStorage.setItem(ENGLISH_WORDLE_LEVEL_KEY, currentLevel);
    if (currentMode === 'random') {
      localStorage.setItem(ENGLISH_WORDLE_RANDOM_KEY, JSON.stringify({ entry: targetEntry, level: currentLevel }));
    } else {
      localStorage.removeItem(ENGLISH_WORDLE_RANDOM_KEY);
    }
  } catch (e) {
    // ignore storage failures
  }
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('msg').textContent = '';
  setLevelButtonState();
  setModeLabel();
  updateMeta();
  updateHintUI();
  renderBoard();
  renderKeyboard();
}

function startDailyGame() { startGame('daily'); }
function startRandomGame() { startGame('random'); }
function startNextRound() {
  document.getElementById('overlay').classList.remove('show');
  startRandomGame();
}

function restoreGame() {
  let savedMode = 'daily';
  let savedLevel = 'daily';
  let savedRandom = null;
  try {
    savedMode = localStorage.getItem(ENGLISH_WORDLE_MODE_KEY) || 'daily';
    savedLevel = localStorage.getItem(ENGLISH_WORDLE_LEVEL_KEY) || 'daily';
    savedRandom = JSON.parse(localStorage.getItem(ENGLISH_WORDLE_RANDOM_KEY) || 'null');
  } catch (e) {
    savedRandom = null;
  }
  currentLevel = LEVEL_LABELS[savedLevel] ? savedLevel : 'daily';
  setLevelButtonState();
  if (savedMode === 'random' && savedRandom && savedRandom.entry && VALID_WORDS.has(savedRandom.entry.word)) {
    startGame('random', savedRandom);
  } else {
    startGame('daily');
  }
}

function getLockedHintIndexes() {
  const locked = new Set();
  guesses.forEach(({ result }) => {
    result.forEach((state, index) => {
      if (state === 'correct') locked.add(index);
    });
  });
  if (hintMode === 'letter' && hintedIndex >= 0) locked.add(hintedIndex);
  return locked;
}

function updateHintUI() {
  const btn = document.getElementById('hint-btn');
  const text = document.getElementById('hint-text');
  if (!btn || !text) return;
  btn.disabled = gameOver || hintUsed;
  if (hintUsed && hintMode === 'letter') {
    text.textContent = `提示：第 ${hintedIndex + 1} 个字母是 ${hintValue.toUpperCase()}`;
  } else if (hintUsed && hintMode === 'meaning') {
    text.textContent = `提示：中文意思是“${hintValue}”`;
  } else if (gameOver) {
    text.textContent = '本局提示已结束';
  } else {
    text.textContent = '本局可提示 1 次：随机显示字母位置或中文意思';
  }
}

function useHint() {
  if (gameOver || hintUsed) return;
  const locked = getLockedHintIndexes();
  const available = Array.from({ length: WORD_LENGTH }, (_, i) => i).filter(i => !locked.has(i));
  const canLetter = available.length > 0;
  const canMeaning = !!(targetEntry && targetEntry.hint);
  if (!canLetter && !canMeaning) {
    document.getElementById('msg').textContent = '当前没有可用提示了';
    return;
  }
  if ((Math.random() < 0.5 && canLetter) || !canMeaning) {
    hintedIndex = available[Math.floor(Math.random() * available.length)];
    hintMode = 'letter';
    hintValue = targetEntry.word[hintedIndex];
    document.getElementById('msg').textContent = `提示：第 ${hintedIndex + 1} 个字母是 ${hintValue.toUpperCase()}`;
  } else {
    hintMode = 'meaning';
    hintValue = targetEntry.hint;
    document.getElementById('msg').textContent = `提示：中文意思是“${hintValue}”`;
  }
  hintUsed = true;
  updateHintUI();
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (let i = 0; i < MAX_ATTEMPTS; i++) {
    const row = document.createElement('div');
    row.className = 'guess-row';
    for (let j = 0; j < WORD_LENGTH; j++) {
      const cell = document.createElement('div');
      cell.className = 'guess-cell';
      if (i < guesses.length) {
        const { word, result } = guesses[i];
        cell.textContent = word[j].toUpperCase();
        cell.classList.add(result[j]);
      } else if (i === guesses.length && j < currentGuess.length) {
        cell.textContent = currentGuess[j].toUpperCase();
        cell.classList.add('active');
      }
      row.appendChild(cell);
    }
    board.appendChild(row);
  }
}

function renderKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  const charState = {};
  for (const { word, result } of guesses) {
    [...word].forEach((ch, i) => {
      const state = result[i];
      if (!charState[ch] || state === 'correct' || (state === 'present' && charState[ch] !== 'correct')) {
        charState[ch] = state;
      }
    });
  }
  KEYBOARD_ROWS.forEach((rowLetters, rowIndex) => {
    const row = document.createElement('div');
    row.className = 'kb-row';
    if (rowIndex === 2) {
      const enterBtn = document.createElement('button');
      enterBtn.className = 'kb-key wide';
      enterBtn.textContent = '确认';
      enterBtn.addEventListener('click', submitGuess);
      row.appendChild(enterBtn);
    }
    [...rowLetters].forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'kb-key';
      if (charState[ch]) btn.classList.add(charState[ch]);
      btn.textContent = ch.toUpperCase();
      btn.addEventListener('click', () => inputChar(ch));
      row.appendChild(btn);
    });
    if (rowIndex === 2) {
      const delBtn = document.createElement('button');
      delBtn.className = 'kb-key wide';
      delBtn.textContent = '删除';
      delBtn.addEventListener('click', deleteLast);
      row.appendChild(delBtn);
    }
    kb.appendChild(row);
  });
}

function inputChar(ch) {
  if (gameOver || currentGuess.length >= WORD_LENGTH) return;
  currentGuess += ch.toLowerCase();
  renderBoard();
  if (!hintUsed) document.getElementById('msg').textContent = '';
}

function deleteLast() {
  if (!currentGuess) return;
  currentGuess = currentGuess.slice(0, -1);
  renderBoard();
}

function evaluateGuess(guess, target) {
  const result = Array(WORD_LENGTH).fill('absent');
  const remaining = [...target];
  for (let i = 0; i < WORD_LENGTH; i++) {
    if (guess[i] === target[i]) {
      result[i] = 'correct';
      remaining[i] = null;
    }
  }
  for (let i = 0; i < WORD_LENGTH; i++) {
    if (result[i] === 'correct') continue;
    const idx = remaining.indexOf(guess[i]);
    if (idx !== -1) {
      result[i] = 'present';
      remaining[idx] = null;
    }
  }
  return result;
}

function submitGuess() {
  if (gameOver) return;
  if (currentGuess.length !== WORD_LENGTH) {
    document.getElementById('msg').textContent = '请先拼满 5 个字母';
    return;
  }
  if (!VALID_WORDS.has(currentGuess)) {
    document.getElementById('msg').textContent = '这个单词暂不在当前词库里';
    return;
  }
  const result = evaluateGuess(currentGuess, targetEntry.word);
  resultEmoji.push(result.map(state => state === 'correct' ? '🟩' : state === 'present' ? '🟨' : '⬜').join(''));
  guesses.push({ word: currentGuess, result });
  currentGuess = '';
  renderBoard();
  renderKeyboard();
  if (result.every(state => state === 'correct')) {
    gameOver = true;
    currentElapsedSeconds = Math.max(1, Math.round((Date.now() - roundStartTime) / 1000));
    saveBest(currentLevel, guesses.length, currentElapsedSeconds);
    updateMeta();
    updateHintUI();
    document.getElementById('msg').textContent = `🎉 猜对了！用时 ${formatDuration(currentElapsedSeconds)}`;
    showResult(true);
    return;
  }
  if (guesses.length >= MAX_ATTEMPTS) {
    gameOver = true;
    currentElapsedSeconds = Math.max(1, Math.round((Date.now() - roundStartTime) / 1000));
    updateHintUI();
    document.getElementById('msg').textContent = `答案是 ${targetEntry.word.toUpperCase()}`;
    showResult(false);
    return;
  }
  updateHintUI();
}

function showResult(won) {
  setTimeout(() => {
    document.getElementById('modal-title').textContent = won ? '🎉 恭喜！' : '😢 没猜中';
    document.getElementById('modal-answer').textContent = targetEntry.word;
    document.getElementById('modal-meaning').textContent = `中文：${targetEntry.hint}`;
    document.getElementById('modal-result').textContent = resultEmoji.join('\n');
    document.getElementById('modal-msg').textContent = won
      ? `第 ${guesses.length} 次猜出｜用时 ${formatDuration(currentElapsedSeconds)}｜${levelLabel(currentLevel)}`
      : `本局用时 ${formatDuration(currentElapsedSeconds)}｜难度 ${levelLabel(currentLevel)}｜可直接开始下一局`;
    document.getElementById('overlay').classList.add('show');
  }, 400);
}

function copyResult() {
  const mode = currentMode === 'random' ? '随机题' : '每日题';
  const extra = currentElapsedSeconds ? `
⏱ ${formatDuration(currentElapsedSeconds)}` : '';
  const text = `🔤 猜词 ${mode} ${levelLabel(currentLevel)} ${getToday()}
${resultEmoji.join('\n')}${extra}
https://jonceli.github.io/mini-games/english-wordle.html`;
  navigator.clipboard.writeText(text).then(() => alert('已复制！'));
}

document.addEventListener('keydown', (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key.toLowerCase();
  if (/^[a-z]$/.test(key)) {
    inputChar(key);
  } else if (key === 'backspace') {
    deleteLast();
  } else if (key === 'enter') {
    submitGuess();
  }
});

restoreGame();
</script>
