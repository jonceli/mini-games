<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猜字 - 成语Wordle</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f7f6f3; min-height: 100vh; }
  .top-bar { display: flex; align-items: center; padding: 16px 16px 8px; max-width: 480px; margin: 0 auto; }
  .back { text-decoration: none; color: #3d6b5e; font-size: 15px; font-weight: 500; }
  .title { font-size: 22px; font-weight: 700; color: #3d6b5e; flex: 1; text-align: center; }
  .subtitle { text-align: center; color: #888; font-size: 13px; padding-bottom: 8px; }
  .mode-bar { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 0 16px 10px; flex-wrap: wrap; }
  .mode-chip { background: white; color: #3d6b5e; border: 1px solid #d7e6df; border-radius: 999px; padding: 6px 12px; font-size: 12px; }
  .mode-btn { background: #3d6b5e; color: white; border: none; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-family: inherit; cursor: pointer; }
  .difficulty-bar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 0 16px 8px; }
  .difficulty-btn { background: white; color: #3d6b5e; border: 1px solid #d7e6df; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-family: inherit; cursor: pointer; }
  .difficulty-btn.active { background: #3d6b5e; color: white; border-color: #3d6b5e; }
  #board { display: flex; flex-direction: column; gap: 6px; padding: 8px 16px; max-width: 340px; margin: 0 auto; }
  .guess-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .guess-cell {
    aspect-ratio: 1; border-radius: 10px; border: 2px solid #ddd;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(16px, 6vw, 28px); font-weight: 700;
    background: white; color: #333; transition: all 0.3s;
  }
  .guess-cell.correct { background: #3d6b5e; color: white; border-color: #3d6b5e; }
  .guess-cell.present { background: #c8a84b; color: white; border-color: #c8a84b; }
  .guess-cell.absent { background: #888; color: white; border-color: #888; }
  .guess-cell.active { border-color: #3d6b5e; }
  .pool-meta { text-align: center; color: #7f8f89; font-size: 12px; padding: 0 16px 8px; }
  #keyboard { padding: 10px 16px 20px; max-width: 480px; margin: 0 auto; }
  .kb-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(38px, 1fr)); gap: 6px; }
  .kb-key {
    background: white; border: none; border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    font-size: 15px; padding: 10px 6px; cursor: pointer;
    color: #333; font-family: inherit; min-height: 42px;
    transition: all 0.2s;
  }
  .kb-key.correct { background: #3d6b5e; color: white; }
  .kb-key.present { background: #c8a84b; color: white; }
  .kb-key.absent { background: #bbb; color: white; }
  .kb-controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .kb-action { background: #3d6b5e; color: white; border: none; border-radius: 999px; padding: 10px 14px; font-size: 13px; font-family: inherit; cursor: pointer; }
  .kb-action.secondary { background: white; color: #3d6b5e; border: 1px solid #3d6b5e; }
  #msg { text-align: center; font-size: 14px; color: #3d6b5e; font-weight: 600; padding: 6px; min-height: 28px; }
  .hint-bar { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 4px 16px 10px; flex-wrap: wrap; }
  .hint-btn {
    background: #c8a84b; color: white; border: none; border-radius: 999px;
    padding: 8px 16px; font-size: 13px; font-family: inherit; cursor: pointer; font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .hint-btn:disabled { background: #d8d0bc; color: #fff; cursor: not-allowed; box-shadow: none; }
  .hint-text { font-size: 13px; color: #7b6a36; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; z-index: 10; }
  .overlay.show { display: flex; }
  .modal { background: white; border-radius: 20px; padding: 28px 24px; text-align: center; max-width: 320px; width: 90%; }
  .modal h2 { font-size: 22px; margin-bottom: 8px; color: #3d6b5e; }
  .modal .answer { font-size: 26px; font-weight: 700; color: #333; margin: 8px 0; }
  .modal .result-grid { font-size: 22px; letter-spacing: 2px; margin: 10px 0; }
  .modal p { color: #666; margin-bottom: 16px; font-size: 13px; }
  .modal-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .modal-btns button { background: #3d6b5e; color: white; border: none; border-radius: 20px; padding: 9px 20px; font-size: 14px; font-family: inherit; cursor: pointer; }
  .modal-btns button.secondary { background: white; color: #3d6b5e; border: 2px solid #3d6b5e; }
</style>

<div class="top-bar">
  <a class="back" href="index.html">← 返回</a>

</div>
<div class="pool-meta" id="pool-meta">难度：标准 24｜本局题池 24 个成语</div>

</div>
<div id="board"></div>
<div id="msg"></div>
<div id="keyboard"></div>
<div class="overlay" id="overlay">
  <div class="modal">

      <button onclick="document.getElementById('overlay').classList.remove('show')">关闭</button>
    </div>
  </div>
</div>

function saveWordleBest(attempts, seconds) {
  try {
    const bestKey = WORDLE_BEST_KEY_PREFIX + String(currentDifficulty || DEFAULT_POOL_SIZE);
    const prev = parseInt(localStorage.getItem(bestKey) || '0', 10);
    if (!prev || attempts < prev) localStorage.setItem(bestKey, String(attempts));
    const timeKey = WORDLE_BEST_TIME_PREFIX + String(currentDifficulty || DEFAULT_POOL_SIZE);
    const prevTime = parseInt(localStorage.getItem(timeKey) || '0', 10);
    if (seconds && (!prevTime || seconds < prevTime)) localStorage.setItem(timeKey, String(seconds));
  } catch (e) {
    // ignore storage failures
  }
}

function getToday() {
  const d = new Date();
  return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
}

function seededRandom(seed) {
  let x = Math.sin(seed + 1) * 10000;
  return x - Math.floor(x);
}

function normalizeGuessText(text) {
  return (text || '').replace(/\s+/g, '').slice(0, 4);
}

function createSeededRng(seed) {
  let t = seed >>> 0;
  return function() {
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}

const COMMON_CHARS = [...new Set(COMMON_IDIOM_PATTERNS.join('') + '人口天地山水风雨日月东西南北上下大小多少春夏秋冬红黄蓝白黑前后左右中大小老少真假冷热远近高低快慢轻重吃喝玩乐衣食住行家国平安幸福成功学习工作生活朋友老师孩子时间办法结果事情心情希望努力')];
const VERY_UNCOMMON_CHARS = ['龃','麤','黩','鼙','臞','齑','觳','罴','鸷','酆','髀','踯','蹰','爨','黾','鼋','饕','餮','鼍','鸩','龉','魑','魅','魍','魉','髑','髅','蹇','罡','罘','螭','黼','黻','孑','孓','忝','佶','侉','龛','缱','绻'];

function getWordWeight(word) {
  let score = 0;
  const bonusPatterns = ['一', '不', '人', '天', '心', '大', '千', '万', '有', '无', '风', '云', '山', '水', '日', '月'];
  bonusPatterns.forEach(ch => {
    if (word.includes(ch)) score += 2;
  });
  COMMON_IDIOM_PATTERNS.forEach(pattern => {
    if (word === pattern) score += 20;
    else if (word.includes(pattern.slice(0, 2)) || word.includes(pattern.slice(2, 4))) score += 4;
  });
  const chars = [...word];
  chars.forEach(ch => {
    if (COMMON_CHARS.includes(ch)) score += 2;
    else score -= 1;
    if (VERY_UNCOMMON_CHARS.includes(ch)) score -= 10;
  });
  if (/^[一二三四五六七八九十百千万上下大小多少东西南北春夏秋冬风雨云山水人天地心手口目日月]/.test(word)) score += 4;
  if (/(山|水|风|云|天|地|日|月|人|心|手|花|春|秋|明|白|青|红|金|玉)/.test(word)) score += 3;
  if (/(之乎者也|焉|矣|兮|者|其)/.test(word)) score -= 2;
  if (/(魑|魅|魍|魉|鼋|爨|蹰|踯|觳|齑|臞|髑|髅)/.test(word)) score -= 12;
  return score;
}

const WORD_SCORES = WORDS.map(word => ({ word, score: getWordWeight(word) })).sort((a, b) => b.score - a.score);
const COMMON_WORDS = WORD_SCORES.slice(0, 1800).map(item => item.word);
const SECONDARY_WORDS = WORD_SCORES.slice(1800, 3200).map(item => item.word);

function getDifficultyLabel(size) {
  if (size === 16) return '简单 16';
  if (size === 32) return '困难 32';
  return '标准 24';
}

function setDifficultyButtonState() {
  [16, 24, 32].forEach(size => {
    const btn = document.getElementById(`difficulty-${size}`);
    if (btn) btn.classList.toggle('active', currentDifficulty === size);
  });
}

function setDifficulty(size, restart = true) {
  currentDifficulty = [16, 24, 32].includes(size) ? size : DEFAULT_POOL_SIZE;
  try { localStorage.setItem(WORDLE_DIFFICULTY_KEY, String(currentDifficulty)); } catch (e) {}
  setDifficultyButtonState();
  if (restart) {
    if (currentMode === 'random') startRandomGame();
    else startDailyGame();
  }
}

function weightedPick(source, rng, used) {
  const topWindow = Math.max(40, Math.floor(source.length * 0.18));
  const midWindow = Math.max(20, Math.floor(source.length * 0.22));
  const roll = rng();
  let index;
  if (roll < 0.72) {
    index = Math.floor(rng() * topWindow);
  } else if (roll < 0.94) {
    index = topWindow + Math.floor(rng() * Math.min(midWindow, Math.max(1, source.length - topWindow)));
  } else {
    index = Math.floor(rng() * source.length);
  }
  index = Math.min(index, source.length - 1);
  let candidate = source[index];
  if (!used.has(candidate)) return candidate;
  for (const word of source) {
    if (!used.has(word)) return word;
  }
  return null;
}

function pickWordPool(rng, size = currentDifficulty || DEFAULT_POOL_SIZE) {
  const pool = [];
  const used = new Set();
  const primaryTarget = Math.min(size, Math.max(10, Math.round(size * 0.85)));
  while (pool.length < primaryTarget && used.size < COMMON_WORDS.length) {
    const word = weightedPick(COMMON_WORDS, rng, used);
    if (!word) break;
    used.add(word);
    pool.push(word);
  }
  while (pool.length < size && used.size < COMMON_WORDS.length + SECONDARY_WORDS.length) {
    const source = SECONDARY_WORDS.length ? SECONDARY_WORDS : COMMON_WORDS;
    const word = weightedPick(source, rng, used);
    if (!word) break;
    used.add(word);
    pool.push(word);
  }
  while (pool.length < size && used.size < WORDS.length) {
    const word = weightedPick(WORDS, rng, used);
    if (!word) break;
    used.add(word);
    pool.push(word);
  }
  return pool;
}

function buildKeyboardChars(pool) {
  return [...new Set(pool.join(''))];
}

function formatDuration(seconds) {
  const s = Math.max(0, Math.floor(seconds || 0));
  const mm = String(Math.floor(s / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return `${mm}:${ss}`;
}

function setModeLabel() {
  const el = document.getElementById('mode-label');
  if (!el) return;
  el.textContent = currentMode === 'random' ? '模式：随机一题' : '模式：每日一题';
}

function updatePoolMeta() {
  const el = document.getElementById('pool-meta');
  if (!el) return;
  const wordCount = currentPool ? currentPool.length : 0;
  const charCount = keyboardChars ? keyboardChars.length : 0;
  const timeKey = WORDLE_BEST_TIME_PREFIX + String(currentDifficulty || DEFAULT_POOL_SIZE);
  let bestTime = '';
  try {
    const best = parseInt(localStorage.getItem(timeKey) || '0', 10);
    if (best) bestTime = `｜最佳时间 ${formatDuration(best)}`;
  } catch (e) {}
  el.textContent = `难度：${getDifficultyLabel(currentDifficulty || DEFAULT_POOL_SIZE)}｜题池 ${wordCount} 个成语｜可选 ${charCount} 个字${bestTime}`;
}

function createDailyGame() {
  const seed = getToday() * 100 + (currentDifficulty || DEFAULT_POOL_SIZE);
  const rng = createSeededRng(seed);
  const pool = pickWordPool(rng);
  const target = pool[Math.floor(rng() * pool.length)];
  return { pool, target, difficulty: currentDifficulty || DEFAULT_POOL_SIZE };
}

function createRandomGame() {
  const pool = pickWordPool(Math.random);
  const target = pool[Math.floor(Math.random() * pool.length)];
  return { pool, target, difficulty: currentDifficulty || DEFAULT_POOL_SIZE };
}

function saveGameState() {
  try {
    const state = {
      mode: currentMode,
      pool: currentPool,
      target: target,
      difficulty: currentDifficulty || DEFAULT_POOL_SIZE,
      guesses: guesses.map(g => ({ word: g.word, result: g.result })),
      currentGuess: currentGuess,
      gameOver: gameOver,
      hintUsed: hintUsed,
      hintedIndex: hintedIndex,
      hintedChar: hintedChar,
      resultEmoji: resultEmoji,
      savedAt: Date.now(),
      elapsedBeforeSave: currentElapsedSeconds || 0
    };
    localStorage.setItem(WORDLE_SAVE_KEY, JSON.stringify(state));
  } catch (e) {
    // ignore storage failures
  }
}

function clearSaveState() {
  try { localStorage.removeItem(WORDLE_SAVE_KEY); } catch (e) {}
}

function startGame(mode, forcedGame) {
  clearSaveState();
  currentMode = mode === 'random' ? 'random' : 'daily';
  const game = forcedGame && Array.isArray(forcedGame.pool) && forcedGame.pool.length
    ? forcedGame
    : (currentMode === 'random' ? createRandomGame() : createDailyGame());
  if (game.difficulty && [16, 24, 32].includes(game.difficulty)) {
    currentDifficulty = game.difficulty;
  }
  currentPool = [...new Set(game.pool.filter(word => WORDS.includes(word)))].slice(0, currentDifficulty || DEFAULT_POOL_SIZE);
  if (!currentPool.length) {
    currentPool = pickWordPool(currentMode === 'random' ? Math.random : createSeededRng(getToday()));
  }
  target = currentPool.includes(game.target) ? game.target : currentPool[0];
  keyboardChars = buildKeyboardChars(currentPool);
  currentElapsedSeconds = 0;
  roundStartTime = Date.now();
  try {
    localStorage.setItem(WORDLE_MODE_KEY, currentMode);
    localStorage.setItem(WORDLE_DIFFICULTY_KEY, String(currentDifficulty || DEFAULT_POOL_SIZE));
    if (currentMode === 'random') {
      localStorage.setItem(WORDLE_RANDOM_GAME_KEY, JSON.stringify({ pool: currentPool, target, difficulty: currentDifficulty || DEFAULT_POOL_SIZE }));
    } else {
      localStorage.removeItem(WORDLE_RANDOM_GAME_KEY);
    }
  } catch (e) {
    // ignore storage failures
  }
  guesses = [];
  currentGuess = '';
  gameOver = false;
  resultEmoji = [];
  hintUsed = false;
  hintedIndex = -1;
  hintedChar = '';
  setDifficultyButtonState();
  setModeLabel();
  updatePoolMeta();
  renderBoard();
  renderKeyboard();
  updateHintUI();
  document.getElementById('msg').textContent = '';
}

function startDailyGame() {
  startGame('daily');
}

function startRandomGame() {
  startGame('random');
}

function startNextRound() {
  document.getElementById('overlay').classList.remove('show');
  startRandomGame();
}

function restoreGame() {
  // Try to restore a saved in-progress game first
  let savedState = null;
  try {
    const raw = localStorage.getItem(WORDLE_SAVE_KEY);
    if (raw) savedState = JSON.parse(raw);
  } catch (e) { savedState = null; }

  if (savedState && savedState.target && Array.isArray(savedState.guesses) && !savedState.gameOver) {
    // Restore full game state
    currentMode = savedState.mode === 'random' ? 'random' : 'daily';
    currentDifficulty = [16, 24, 32].includes(savedState.difficulty) ? savedState.difficulty : DEFAULT_POOL_SIZE;
    currentPool = [...new Set((savedState.pool || []).filter(w => WORDS.includes(w)))].slice(0, currentDifficulty || DEFAULT_POOL_SIZE);
    if (!currentPool.length) currentPool = pickWordPool(currentMode === 'random' ? Math.random : createSeededRng(getToday()));
    target = currentPool.includes(savedState.target) ? savedState.target : (currentPool[0] || '');
    keyboardChars = buildKeyboardChars(currentPool);
    guesses = savedState.guesses.map(g => ({ word: g.word, result: g.result }));
    currentGuess = savedState.currentGuess || '';
    gameOver = false;
    hintUsed = !!savedState.hintUsed;
    hintedIndex = typeof savedState.hintedIndex === 'number' ? savedState.hintedIndex : -1;
    hintedChar = savedState.hintedChar || '';
    resultEmoji = Array.isArray(savedState.resultEmoji) ? savedState.resultEmoji : [];
    // Adjust elapsed time — account for time away
    const pausedSecs = Math.round((Date.now() - (savedState.savedAt || Date.now())) / 1000);
    currentElapsedSeconds = (savedState.elapsedBeforeSave || 0);
    roundStartTime = Date.now() - (currentElapsedSeconds * 1000);
    setDifficultyButtonState();
    setModeLabel();
    updatePoolMeta();
    renderBoard();
    renderKeyboard();
    updateHintUI();
    document.getElementById('msg').textContent = '📋 已恢复存档，继续猜吧！';
    return;
  }

  // Fallback: no saved in-progress game
  let savedMode = 'daily';
  let savedRandomGame = null;
  let savedDifficulty = DEFAULT_POOL_SIZE;
  try {
    savedMode = localStorage.getItem(WORDLE_MODE_KEY) || 'daily';
    savedRandomGame = JSON.parse(localStorage.getItem(WORDLE_RANDOM_GAME_KEY) || 'null');
    savedDifficulty = parseInt(localStorage.getItem(WORDLE_DIFFICULTY_KEY) || String(DEFAULT_POOL_SIZE), 10);
  } catch (e) {
    savedRandomGame = null;
  }
  currentDifficulty = [16, 24, 32].includes(savedDifficulty) ? savedDifficulty : DEFAULT_POOL_SIZE;
  setDifficultyButtonState();
  if (
    savedMode === 'random' &&
    savedRandomGame &&
    Array.isArray(savedRandomGame.pool) &&
    savedRandomGame.pool.length &&
    typeof savedRandomGame.target === 'string'
  ) {
    startGame('random', savedRandomGame);
  } else {
    startGame('daily');
  }
}

function getLockedHintIndexes() {
  const locked = new Set();
  guesses.forEach(({ result }) => {
    result.forEach((state, index) => {
      if (state === 'correct') locked.add(index);
    });
  });
  if (hintUsed && hintedIndex >= 0) locked.add(hintedIndex);
  return locked;
}

function updateHintUI() {
  const btn = document.getElementById('hint-btn');
  const text = document.getElementById('hint-text');
  if (!btn || !text) return;
  const disabled = gameOver || hintUsed;
  btn.disabled = disabled;
  if (hintUsed && hintedIndex >= 0) {
    text.textContent = `提示：第 ${hintedIndex + 1} 个字是「${hintedChar}」`;
  } else if (gameOver) {
    text.textContent = '本局提示已结束';
  } else {
    text.textContent = '本局还可使用 1 次提示';
  }
}

function useHint() {
  if (gameOver || hintUsed) return;
  const locked = getLockedHintIndexes();
  const available = [0, 1, 2, 3].filter(index => !locked.has(index));
  if (!available.length) {
    document.getElementById('msg').textContent = '当前没有可提示的新位置了';
    return;
  }
  hintedIndex = available[Math.floor(Math.random() * available.length)];
  hintedChar = target[hintedIndex];
  hintUsed = true;
  document.getElementById('msg').textContent = `提示：第 ${hintedIndex + 1} 个字是「${hintedChar}」`;
  updateHintUI();
  renderBoard();
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for(let i=0;i<6;i++) {
    const row = document.createElement('div');
    row.className = 'guess-row';
    for(let j=0;j<4;j++) {
      const cell = document.createElement('div');
      cell.className = 'guess-cell';
      if(i < guesses.length) {
        const {word, result} = guesses[i];
        cell.textContent = word[j];
        cell.classList.add(result[j]);
      } else if(i === guesses.length) {
        if(j < currentGuess.length) {
          cell.textContent = currentGuess[j];
          cell.classList.add('active');
        }
      }
      row.appendChild(cell);
    }
    board.appendChild(row);
  }
}

function renderKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  const charState = {};
  for (const {word, result} of guesses) {
    word.split('').forEach((ch, i) => {
      const s = result[i];
      if (!charState[ch] || s === 'correct' || (s === 'present' && charState[ch] !== 'correct')) {
        charState[ch] = s;
      }
    });
  }
  const grid = document.createElement('div');
  grid.className = 'kb-grid';
  keyboardChars.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'kb-key';
    btn.textContent = ch;
    if (charState[ch]) btn.classList.add(charState[ch]);
    btn.addEventListener('click', () => inputChar(ch));
    grid.appendChild(btn);
  });
  kb.appendChild(grid);
  const controls = document.createElement('div');
  controls.className = 'kb-controls';
  controls.innerHTML = `
    <button class="kb-action secondary" onclick="deleteLast()">⌫ 删除</button>
    <button class="kb-action" onclick="submitGuess()">✓ 确认</button>
  `;
  kb.appendChild(controls);
}

function inputChar(ch) {
  if (gameOver || currentGuess.length >= 4) return;
  currentGuess += ch;
  renderBoard();
  if (!hintUsed) document.getElementById('msg').textContent = '';
}

function deleteLast() {
  if(!currentGuess) return;
  currentGuess = currentGuess.slice(0,-1);
  renderBoard();
}

// Save state before leaving the page
window.addEventListener('beforeunload', function() {
  if (!gameOver && guesses.length > 0) saveGameState();
});

function submitGuess() {
  if(gameOver) return;
  if(currentGuess.length !== 4) { document.getElementById('msg').textContent = '请先选满4个字'; return; }
  const result = evaluateGuess(currentGuess, target);
  const emoji = result.map(r => r==='correct'?'🟩':r==='present'?'🟨':'⬜').join('');
  resultEmoji.push(emoji);
  guesses.push({word: currentGuess, result});
  currentGuess = '';
  renderBoard();
  renderKeyboard();
  saveGameState();
  if(result.every(r=>r==='correct')) {
    gameOver = true;
    currentElapsedSeconds = Math.max(1, Math.round((Date.now() - roundStartTime) / 1000));
    updateHintUI();
    saveWordleBest(guesses.length, currentElapsedSeconds);
    updatePoolMeta();
    clearSaveState();
    document.getElementById('msg').textContent = `🎉 答对了！用时 ${formatDuration(currentElapsedSeconds)}`;
    showResult(true);
    return;
  }
  if(guesses.length >= 6) {
    gameOver = true;
    currentElapsedSeconds = Math.max(1, Math.round((Date.now() - roundStartTime) / 1000));
    updateHintUI();
    clearSaveState();
    document.getElementById('msg').textContent = `答案是：${target}`;
    showResult(false);
    return;
  }
  updateHintUI();
}

function evaluateGuess(guess, target) {
  const result = Array(4).fill('absent');
  const remaining = [...target];
  // First pass: correct
  for(let i=0;i<4;i++) {
    if(guess[i]===target[i]) { result[i]='correct'; remaining[i]=null; }
  }
  // Second pass: present
  for(let i=0;i<4;i++) {
    if(result[i]==='correct') continue;
    const idx = remaining.indexOf(guess[i]);
    if(idx !== -1) { result[i]='present'; remaining[idx]=null; }
  }
  return result;
}

function showResult(won) {
  setTimeout(() => {
    document.getElementById('modal-title').textContent = won ? '🎉 恭喜！' : '😢 遗憾';
    document.getElementById('modal-answer').textContent = target;
    document.getElementById('modal-result').textContent = resultEmoji.join('\n');
    document.getElementById('modal-msg').textContent = won
      ? `第 ${guesses.length} 次猜出｜用时 ${formatDuration(currentElapsedSeconds)}｜${getDifficultyLabel(currentDifficulty || DEFAULT_POOL_SIZE)}`
      : `本局用时 ${formatDuration(currentElapsedSeconds)}｜可直接开始下一局`;
    document.getElementById('overlay').classList.add('show');
  }, 400);
}

function copyResult() {
  const mode = currentMode === 'random' ? '随机题' : '每日题';
  const difficulty = getDifficultyLabel(currentDifficulty || DEFAULT_POOL_SIZE);
  const extra = currentElapsedSeconds ? `\n⏱ ${formatDuration(currentElapsedSeconds)}` : '';
  const text = `📝猜字 ${mode} ${difficulty} ${getToday()}\n${resultEmoji.join('\n')}${extra}\nhttps://jonceli.github.io/mini-games/wordle.html`;
  navigator.clipboard.writeText(text).then(() => alert('已复制！'));
}

restoreGame();
